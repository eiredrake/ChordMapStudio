services:
  chord-map-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: chord-map-studio:latest
    container_name: chord-map-studio
    restart: unless-stopped
    environment:
      PORT: ${CHORD_MAP_PORT:-8080}
      TZ: ${TZ:-America/New_York}
    expose:
      - "${CHORD_MAP_PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy-tier  

networks:
  proxy-tier:
    external: true               
